name: Atlas
options:
  bundleIdPrefix: com.p1tan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Real code signing (added once a physical device came into the picture --
# no Apple Developer account existed on this machine before, hence every
# target's own CODE_SIGNING_ALLOWED: NO below). A free personal team is
# enough for on-device testing (Peter Tan (Personal Team), no paid Developer
# Program needed for this app -- no push notifications/App Groups/other
# capability that would require one). Project-level so every target
# inherits it without repeating the same three lines four times; still
# works unchanged for Simulator builds -- this is the default state of a
# completely normal Xcode project, not Simulator-vs-device-conditional.
settings:
  base:
    DEVELOPMENT_TEAM: 893CXP2LVF
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.16.0
targets:
  Atlas:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Atlas
    info:
      path: Atlas/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCalendarsFullAccessUsageDescription: "Atlas needs calendar access to add events you've confirmed from extracted emails."
        NSMicrophoneUsageDescription: "Atlas uses your microphone to hear you when you talk to it."
        NSSpeechRecognitionUsageDescription: "Atlas transcribes your speech on-device to understand what you say."
        CFBundleURLTypes:
          - CFBundleURLName: com.p1tan.atlas
            CFBundleURLSchemes:
              - atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: AtlasShareExtension
        embed: true
      - target: AtlasWidget
        embed: true
      - package: Supabase
      - package: LiveKit
  AtlasShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AtlasShareExtension
    info:
      path: AtlasShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas.share
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  AtlasWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AtlasWidget
    info:
      path: AtlasWidget/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas.widget
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AtlasUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas.uitests
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        # No custom Info.plist content needed (no permissions/URL schemes of
        # its own) -- only surfaced as a real gap once code signing was
        # actually enabled (real device support): codesign requires SOME
        # Info.plist to exist even for a UI test bundle, which
        # CODE_SIGNING_ALLOWED: NO had been silently masking until now.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Atlas
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasShareExtension: all
        AtlasWidget: all
        AtlasUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtlasUITests
