name: Atlas
options:
  bundleIdPrefix: com.p1tan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Declared explicitly rather than leaning on XcodeGen's implicit default
# pair, so the Debug/Release split is visible in the one file that is the
# source of truth. The `release` type is what makes SwiftPM build the
# Supabase/LiveKit dependencies optimized too, not just our own code.
configs:
  Debug: debug
  Release: release
# Real code signing (added once a physical device came into the picture --
# no Apple Developer account existed on this machine before, so every target
# used to carry its own CODE_SIGNING_ALLOWED: NO; those are all gone now).
# A free personal team is
# enough for on-device testing (Peter Tan (Personal Team), no paid Developer
# Program needed for this app -- no push notifications/App Groups/other
# capability that would require one). Project-level so every target
# inherits it without repeating the same three lines four times; still
# works unchanged for Simulator builds -- this is the default state of a
# completely normal Xcode project, not Simulator-vs-device-conditional.
settings:
  base:
    DEVELOPMENT_TEAM: 893CXP2LVF
  # XcodeGen's setting presets already supply most of Apple's stock
  # Debug/Release values, but they do it invisibly and the Release half had
  # never actually been compiled -- the schemes only ever ran Debug. Pinned
  # here so the contrast between the two is a deliberate, auditable choice
  # instead of a preset side effect, and so a future XcodeGen version (or
  # someone setting `settingPresets: none`) can't silently flip the
  # `#if DEBUG` seams the entire UI test suite depends on.
  configs:
    Debug:
      # Load-bearing: AuthViewModel.bootstrap()'s ATLAS_TEST_ACCESS_TOKEN /
      # ATLAS_TEST_REFRESH_TOKEN / ATLAS_TEST_FORCE_SIGNED_OUT seams and
      # AtlasApp's ATLAS_TEST_SHARE_TEXT seam are all `#if DEBUG`, so every
      # XCUITest that signs in depends on this symbol being defined.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    Release:
      # Deliberately NOT DEBUG. This is the setting that compiles the
      # environment-variable session-injection seams out of a shipping
      # binary; `strings` on the Release app must not contain
      # ATLAS_TEST_ACCESS_TOKEN or ATLAS_TEST_SHARE_TEXT.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      # No `@testable import` into a shipping build: testability emits extra
      # symbols and disables cross-module optimization.
      ENABLE_TESTABILITY: NO
      # Ship stripped, keep a dSYM alongside so crash reports symbolicate.
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DEAD_CODE_STRIPPING: YES
      # Runs the bundle/product validation that App Store submission applies,
      # here rather than for the first time at upload.
      VALIDATE_PRODUCT: YES
      ENABLE_NS_ASSERTIONS: NO
      # Build every slice, not just the active one -- a device archive must
      # not depend on which Mac produced it.
      ONLY_ACTIVE_ARCH: NO
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.16.0
targets:
  Atlas:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Atlas
    info:
      path: Atlas/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCalendarsFullAccessUsageDescription: "Atlas needs calendar access to add events you've confirmed from extracted emails."
        NSMicrophoneUsageDescription: "Atlas uses your microphone to hear you when you talk to it."
        NSLocationWhenInUseUsageDescription: "Atlas uses your approximate location so it can answer location-based questions (like the weather) without you having to say where you are."
        NSSpeechRecognitionUsageDescription: "Atlas transcribes your speech on-device to understand what you say."
        CFBundleURLTypes:
          - CFBundleURLName: com.p1tan.atlas
            CFBundleURLSchemes:
              - atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: AtlasShareExtension
        embed: true
      - target: AtlasWidget
        embed: true
      - package: Supabase
      - package: LiveKit
  AtlasShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AtlasShareExtension
    info:
      path: AtlasShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas.share
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  AtlasWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AtlasWidget
    info:
      path: AtlasWidget/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas.widget
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AtlasUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1tan.atlas.uitests
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        # No custom Info.plist content needed (no permissions/URL schemes of
        # its own) -- only surfaced as a real gap once code signing was
        # actually enabled (real device support): codesign requires SOME
        # Info.plist to exist even for a UI test bundle, which
        # CODE_SIGNING_ALLOWED: NO had been silently masking until now.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Atlas
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasShareExtension: all
        AtlasWidget: all
        AtlasUITests: [test]
    # Run/test stay Debug (the UI tests need the `#if DEBUG` seams); the
    # actions that produce something shippable are pinned to Release so
    # archiving can never quietly ship an unoptimized, seam-carrying build.
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtlasUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
